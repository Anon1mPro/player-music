<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Audio Visualizer & Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #080810;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* ORQA FON RASMI KONTEYNERI */
        #bgContainer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #bgImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            transform-origin: center center;
            transition: transform 0.05s linear;
        }

        #edgeGlow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
            box-shadow: inset 0 0 60px var(--circle-color, #66fcf1);
            opacity: 0.2;
            transition: opacity 0.05s ease;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
        }

        .main-panel {
            position: absolute;
            z-index: 10;
            top: 15px;
            right: 15px;
            width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            background: rgba(15, 15, 26, 0.92);
            padding: 15px;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .main-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-10px) scale(0.95);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 6px;
        }

        .panel-header h3 {
            font-size: 12px;
            text-transform: uppercase;
            color: #66fcf1;
            letter-spacing: 0.5px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .close-btn:hover { color: #ff4d4d; }

        .section-title {
            font-weight: bold;
            color: #ff007f;
            margin-top: 6px;
            font-size: 11px;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 2px;
        }

        label {
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .file-label {
            cursor: pointer;
            background: #1f2833;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
            font-size: 11px;
        }

        select, input[type="range"], input[type="color"], input[type="text"] {
            background: #1f2833;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px;
            border-radius: 4px;
            width: 100%;
        }

        .checkbox-label {
            flex-direction: row !important;
            justify-content: space-between;
            cursor: pointer;
        }

        /* MARKAZIY DOIRA O'RALMASI */
        .circle-wrapper {
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .circle-container {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            cursor: pointer;
            box-shadow: 0 0 25px var(--circle-color, #66fcf1);
            touch-action: manipulation;
            overflow: hidden;
            position: relative;
        }

        /* DOIRA ICHIDAGI RASM */
        .circle-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            transform-origin: center center;
            transition: transform 0.05s linear;
        }

        .subtitle-container {
            position: absolute;
            bottom: 20px;
            z-index: 10;
            text-align: center;
            width: 90%;
            transition: opacity 0.3s ease;
        }
        .subtitle-container.hidden { opacity: 0; pointer-events: none; }
        .subtitle {
            font-size: 13px;
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.15);
            display: inline-block;
        }

        @media (max-width: 600px) {
            .main-panel {
                width: 90%;
                right: 5%;
                top: 10px;
            }
            .circle-container {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>

    <div id="bgContainer">
        <img id="bgImg" src="" style="display: none;" alt="Background Image">
    </div>

    <div id="edgeGlow"></div>
    <canvas id="visualizer"></canvas>

    <div class="circle-wrapper">
        <div class="circle-container" id="circleBtn">
            <img class="circle-img" id="circleImg" src="https://picsum.photos/300" alt="Circle Inner Image">
        </div>
    </div>

    <div class="main-panel hidden" id="mainPanel">
        <div class="panel-header">
            <h3>🎛 Sozlamalar</h3>
            <button class="close-btn" onclick="toggleMainPanel()">✖</button>
        </div>

        <div class="section-title">🎵 MUSIQA</div>
        <label class="file-label">🎵 Musiqa Fayli Yuklash <input type="file" id="audioInput" accept="audio/*" style="display:none"></label>

        <div class="section-title">🖼 ORQA FON RASMI SOZLAMALARI</div>
        <label class="file-label">🖼 Orqa Fon Faylini Yuklash <input type="file" id="bgFileInput" accept="image/*" style="display:none"></label>
        <label>🔗 Orqa Fon URL (Silka):
            <input type="text" id="bgUrlInput" placeholder="https://example.com/bg.jpg">
        </label>
        <label>🔍 Fon Kattaligi (Scale):
            <input type="range" id="bgScaleInput" min="0.5" max="3" step="0.05" value="1">
        </label>
        <label>🔄 Fon Burilishi (Rotate):
            <input type="range" id="bgRotateInput" min="0" max="360" step="1" value="0">
        </label>

        <div class="section-title">💿 DOIRA RASMI SOZLAMALARI</div>
        <label class="file-label">💿 Doira Rasmini Yuklash <input type="file" id="circleFileInput" accept="image/*" style="display:none"></label>
        <label>🔗 Doira Rasmi URL (Silka):
            <input type="text" id="circleUrlInput" placeholder="https://example.com/image.jpg">
        </label>
        <label>🔍 Rasm Kattaligi (Scale):
            <input type="range" id="imgScaleInput" min="0.5" max="2" step="0.05" value="1">
        </label>
        <label>🔄 Rasm Burilishi (Rotate):
            <input type="range" id="imgRotateInput" min="0" max="360" step="1" value="0">
        </label>

        <div class="section-title">▶ PLAYER</div>
        <div style="display: flex; gap: 8px; align-items: center;">
            <button id="playBtn" style="background:#1f2833; border:1px solid #fff; color:#fff; padding:6px 12px; border-radius:4px;">▶</button>
            <input type="range" id="seekBar" value="0" min="0" max="100" step="0.1" style="flex:1;">
        </div>
        <div style="display: flex; justify-content: space-between; font-size:10px;" id="timeDisplay">00:00 / 00:00</div>
        <label>🔊 Quloqqa Eshitiladigan Ovoz:
            <input type="range" id="volumeBar" value="1" min="0" max="1" step="0.05">
        </label>

        <div class="section-title">⚡ EFFEKTLAR UCHUN MUSIQA BALANDLIGI</div>
        <label>🎚 Effektlar Sezgirligi (Sensitivity):
            <input type="range" id="visualSensitivity" min="0.1" max="1.5" step="0.05" value="0.6">
        </label>

        <div class="section-title">⭕ DOIRA EFFEKTI</div>
        <label>Doira Rejimi:
            <select id="circleMode">
                <option value="circle360">To'liq 360° Nur</option>
                <option value="dotsCircle">Aylanuvchi Nuqtalar</option>
                <option value="sunburst">Quyosh Nurlari</option>
                <option value="glowRing">Pulsatsiyalanuvchi Halqa</option>
                <option value="none">O'chirilgan</option>
            </select>
        </label>
        <label>Doira Rangi:
            <input type="color" id="circleColorInput" value="#66fcf1">
        </label>
        <label>Nurlar Uzunligi:
            <input type="range" id="circleBarLength" min="10" max="200" step="5" value="60">
        </label>

        <div class="section-title">📺 EKRAN EFFEKTI</div>
        <label>Ekran Rejimi:
            <select id="bgMode">
                <option value="none">Yo'q</option>
                <option value="dualSides">2 Yon Tomon</option>
                <option value="topBottom">Tepa va Past</option>
                <option value="oneSide">Faqat Past</option>
                <option value="smoothWave">Suv To'lqini</option>
                <option value="boxFrame">4 Tomonlama Ramka</option>
                <option value="matrixDots">Matrix Zarrachalar</option>
            </select>
        </label>
        <label>Ekran Rangi:
            <input type="color" id="bgColorInput" value="#ff007f">
        </label>
        <label>Ekran Balandligi:
            <input type="range" id="bgBarLength" min="0.05" max="0.8" step="0.05" value="0.25">
        </label>

        <div class="section-title">⚙ O'ZGARISHLAR</div>
        <label class="checkbox-label">Doira Aylansin:
            <input type="checkbox" id="enableRotate" checked>
        </label>
        <label>Doira Pulsatsiyasi (Bass):
            <input type="range" id="bassScale" min="0" max="2" step="0.1" value="1">
        </label>
        <label class="checkbox-label">Subtitr Ko'rinsin:
            <input type="checkbox" id="showSubtitleCheck" checked>
        </label>
    </div>

    <div class="subtitle-container hidden" id="subtitleContainer">
        <div class="subtitle" id="subtitleText">Musiqa yuklang (Doirani bosib tursangiz panel chiqadi)</div>
    </div>

    <script>
        const circleBtn = document.getElementById('circleBtn');
        const circleImg = document.getElementById('circleImg');
        const bgImg = document.getElementById('bgImg');
        const mainPanel = document.getElementById('mainPanel');
        const subtitleContainer = document.getElementById('subtitleContainer');
        const subtitleText = document.getElementById('subtitleText');
        const showSubtitleCheck = document.getElementById('showSubtitleCheck');
        
        const audioInput = document.getElementById('audioInput');
        const bgFileInput = document.getElementById('bgFileInput');
        const bgUrlInput = document.getElementById('bgUrlInput');
        const bgScaleInput = document.getElementById('bgScaleInput');
        const bgRotateInput = document.getElementById('bgRotateInput');

        const circleFileInput = document.getElementById('circleFileInput');
        const circleUrlInput = document.getElementById('circleUrlInput');
        const imgScaleInput = document.getElementById('imgScaleInput');
        const imgRotateInput = document.getElementById('imgRotateInput');
        
        const edgeGlow = document.getElementById('edgeGlow');
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        const playBtn = document.getElementById('playBtn');
        const seekBar = document.getElementById('seekBar');
        const timeDisplay = document.getElementById('timeDisplay');
        const volumeBar = document.getElementById('volumeBar');
        const visualSensitivity = document.getElementById('visualSensitivity');

        const circleModeSelect = document.getElementById('circleMode');
        const circleColorInput = document.getElementById('circleColorInput');
        const circleBarLengthInput = document.getElementById('circleBarLength');
        const bgModeSelect = document.getElementById('bgMode');
        const bgColorInput = document.getElementById('bgColorInput');
        const bgBarLengthInput = document.getElementById('bgBarLength');
        const enableRotateCheck = document.getElementById('enableRotate');
        const bassScaleInput = document.getElementById('bassScale');

        let audio = new Audio();
        let audioCtx, analyser, source, dataArray;
        let isPlaying = false;
        let rotationAngle = 0;
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function toggleMainPanel() {
            mainPanel.classList.toggle('hidden');
            if (showSubtitleCheck.checked) {
                subtitleContainer.classList.toggle('hidden', mainPanel.classList.contains('hidden'));
            }
        }

        // ORQA FON TRANSFORMASIYASI
        function updateBgTransform() {
            let scale = bgScaleInput.value;
            let rotate = bgRotateInput.value;
            bgImg.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
        }

        bgScaleInput.oninput = updateBgTransform;
        bgRotateInput.oninput = updateBgTransform;

        bgFileInput.onchange = (e) => {
            if(e.target.files[0]) {
                bgImg.src = URL.createObjectURL(e.target.files[0]);
                bgImg.style.display = 'block';
            }
        };

        bgUrlInput.onchange = (e) => {
            if(e.target.value.trim() !== '') {
                bgImg.src = e.target.value.trim();
                bgImg.style.display = 'block';
            }
        };

        // DOIRA RASMI TRANSFORMASIYASI
        function updateCircleImageTransform() {
            let scale = imgScaleInput.value;
            let rotate = imgRotateInput.value;
            circleImg.style.transform = `scale(${scale}) rotate(${rotate}deg)`;
        }

        imgScaleInput.oninput = updateCircleImageTransform;
        imgRotateInput.oninput = updateCircleImageTransform;

        circleFileInput.onchange = (e) => {
            if(e.target.files[0]) {
                circleImg.src = URL.createObjectURL(e.target.files[0]);
            }
        };

        circleUrlInput.onchange = (e) => {
            if(e.target.value.trim() !== '') {
                circleImg.src = e.target.value.trim();
            }
        };

        // LONG PRESS MANTIQLARI
        let pressTimer;
        let isLongPress = false;

        function startPress() {
            isLongPress = false;
            pressTimer = setTimeout(() => {
                isLongPress = true;
                toggleMainPanel();
            }, 500);
        }

        function cancelPress() {
            clearTimeout(pressTimer);
        }

        circleBtn.addEventListener('mousedown', startPress);
        circleBtn.addEventListener('touchstart', (e) => { startPress(); }, {passive: true});

        circleBtn.addEventListener('mouseup', () => {
            cancelPress();
            if (!isLongPress) togglePlay();
        });

        circleBtn.addEventListener('touchend', () => {
            cancelPress();
            if (!isLongPress) togglePlay();
        });

        circleBtn.addEventListener('mouseleave', cancelPress);
        circleBtn.addEventListener('touchmove', cancelPress);

        // KLAVIATURA (B va Space)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'b' || e.key === 'B') {
                toggleMainPanel();
            }
            if (e.code === 'Space') {
                if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                    e.preventDefault();
                    togglePlay();
                }
            }
        });

        showSubtitleCheck.addEventListener('change', (e) => {
            subtitleContainer.classList.toggle('hidden', !e.target.checked);
        });

        audioInput.onchange = (e) => {
            if(e.target.files[0]) {
                audio.src = URL.createObjectURL(e.target.files[0]);
                subtitleText.innerText = e.target.files[0].name;
            }
        };

        circleColorInput.oninput = (e) => {
            document.documentElement.style.setProperty('--circle-color', e.target.value);
        };

        playBtn.onclick = togglePlay;

        function togglePlay() {
            if (!audio.src) return alert("Avval musiqa faylini yuklang!");
            if (!audioCtx) setupAudioContext();

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerText = "▶";
            } else {
                audio.play();
                isPlaying = true;
                playBtn.innerText = "⏸";
                render();
            }
        }

        audio.ontimeupdate = () => {
            if (!isNaN(audio.duration)) {
                seekBar.value = (audio.currentTime / audio.duration) * 100;
                timeDisplay.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            }
        };

        seekBar.oninput = () => {
            if (!isNaN(audio.duration)) {
                audio.currentTime = (seekBar.value / 100) * audio.duration;
            }
        };

        volumeBar.oninput = () => {
            audio.volume = volumeBar.value;
        };

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }

        function setupAudioContext() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            analyser.fftSize = 128; 
            dataArray = new Uint8Array(analyser.frequencyBinCount);

            for(let i=0; i<60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    speed: 1 + Math.random() * 3,
                    size: 1 + Math.random() * 3
                });
            }
        }

        function render() {
            if (!isPlaying) return;
            requestAnimationFrame(render);

            analyser.getByteFrequencyData(dataArray);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Vizualizatsiya sezgirligini hisoblash
            let sensitivity = parseFloat(visualSensitivity.value);

            let rawBass = dataArray[2] || 0;
            let bass = Math.min(255, rawBass * sensitivity);

            edgeGlow.style.opacity = (bass / 255) * 0.8;
            edgeGlow.style.boxShadow = `inset 0 0 ${40 + (bass / 4)}px ${circleColorInput.value}`;

            let scaleMultiplier = parseFloat(bassScaleInput.value);
            let scale = 1 + ((bass / 255) * 0.35 * scaleMultiplier);
            circleBtn.style.transform = `scale(${scale}) rotate(${rotationAngle}deg)`;

            if (enableRotateCheck.checked) {
                rotationAngle += 0.3 + (bass / 90);
            }

            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const N = 32;

            const activeData = [];
            for (let i = 0; i < N; i++) {
                let val = (dataArray[i] * (1 + (i / N) * 1.5)) * sensitivity;
                activeData.push(Math.min(255, val));
            }

            // 1. EKRAN EFFEKTLARI
            const bgMode = bgModeSelect.value;
            const bgMaxLen = parseFloat(bgBarLengthInput.value);
            ctx.fillStyle = bgColorInput.value;
            ctx.strokeStyle = bgColorInput.value;

            if (bgMode === 'dualSides') {
                let barHeight = canvas.height / N;
                for (let i = 0; i < N; i++) {
                    let len = (activeData[i] / 255) * (canvas.width * bgMaxLen);
                    let y = i * barHeight;
                    ctx.fillRect(0, y, len, barHeight - 1);
                    ctx.fillRect(canvas.width - len, y, len, barHeight - 1);
                }
            } else if (bgMode === 'topBottom') {
                let barWidth = (canvas.width / 2) / N;
                for (let i = 0; i < N; i++) {
                    let len = (activeData[i] / 255) * (canvas.height * bgMaxLen);
                    let xRight = cx + (i * barWidth);
                    let xLeft = cx - (i * barWidth);
                    ctx.fillRect(xRight, 0, barWidth - 1, len);
                    ctx.fillRect(xLeft, 0, barWidth - 1, len);
                    ctx.fillRect(xRight, canvas.height - len, barWidth - 1, len);
                    ctx.fillRect(xLeft, canvas.height - len, barWidth - 1, len);
                }
            } else if (bgMode === 'oneSide') {
                let barWidth = canvas.width / N;
                for (let i = 0; i < N; i++) {
                    let len = (activeData[i] / 255) * (canvas.height * bgMaxLen);
                    ctx.fillRect(i * barWidth, canvas.height - len, barWidth - 2, len);
                }
            } else if (bgMode === 'smoothWave') {
                ctx.beginPath();
                ctx.lineWidth = 4;
                for (let x = 0; x <= canvas.width; x += 4) {
                    let index = Math.floor((x / canvas.width) * N);
                    let v = activeData[index] / 255;
                    let y = cy + Math.sin(x * 0.01 + rotationAngle * 0.05) * (v * 100 * bgMaxLen * 2);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();
            } else if (bgMode === 'boxFrame') {
                let len = (bass / 255) * (100 * bgMaxLen);
                ctx.lineWidth = 6;
                ctx.strokeRect(len, len, canvas.width - (len*2), canvas.height - (len*2));
            } else if (bgMode === 'matrixDots') {
                particles.forEach((p, idx) => {
                    let boost = (activeData[idx % N] / 255) * 10;
                    p.y -= (p.speed + boost);
                    if(p.y < 0) p.y = canvas.height;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size + (boost/2), 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // 2. DOIRA EFFEKTLARI
            const circleMode = circleModeSelect.value;
            const circleMaxLen = parseFloat(circleBarLengthInput.value);

            if (circleMode === 'circle360') {
                let radius = ((circleBtn.offsetWidth / 2) * scale) + 4;
                ctx.strokeStyle = circleColorInput.value;

                for (let i = 0; i < N; i++) {
                    let value = activeData[i];
                    let barLen = Math.max(2, (value / 255) * circleMaxLen);

                    let angleRight = -Math.PI / 2 + (i / N) * Math.PI;
                    let angleLeft = -Math.PI / 2 - (i / N) * Math.PI;

                    [angleRight, angleLeft].forEach(angle => {
                        let x1 = cx + Math.cos(angle) * radius;
                        let y1 = cy + Math.sin(angle) * radius;
                        let x2 = cx + Math.cos(angle) * (radius + barLen);
                        let y2 = cy + Math.sin(angle) * (radius + barLen);

                        ctx.beginPath();
                        ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.lineWidth = 2.5;
                        ctx.lineCap = 'round';
                        ctx.stroke();
                    });
                }
            } else if (circleMode === 'dotsCircle') {
                let radius = ((circleBtn.offsetWidth / 2) * scale) + 10;
                ctx.fillStyle = circleColorInput.value;

                for (let i = 0; i < N; i++) {
                    let value = activeData[i];
                    let dist = radius + ((value / 255) * circleMaxLen);
                    let angleRight = -Math.PI / 2 + (i / N) * Math.PI;
                    let angleLeft = -Math.PI / 2 - (i / N) * Math.PI;

                    [angleRight, angleLeft].forEach(angle => {
                        let x = cx + Math.cos(angle) * dist;
                        let y = cy + Math.sin(angle) * dist;
                        ctx.beginPath();
                        ctx.arc(x, y, 3 + (value/50), 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
            } else if (circleMode === 'sunburst') {
                let radius = ((circleBtn.offsetWidth / 2) * scale) + 2;
                ctx.fillStyle = circleColorInput.value;

                for (let i = 0; i < N; i++) {
                    let value = activeData[i];
                    let barLen = (value / 255) * circleMaxLen;
                    let angleRight = -Math.PI / 2 + (i / N) * Math.PI;
                    let angleLeft = -Math.PI / 2 - (i / N) * Math.PI;

                    [angleRight, angleLeft].forEach(angle => {
                        ctx.beginPath();
                        ctx.arc(cx, cy, radius + barLen, angle - 0.03, angle + 0.03);
                        ctx.lineTo(cx, cy);
                        ctx.fill();
                    });
                }
            } else if (circleMode === 'glowRing') {
                let radius = ((circleBtn.offsetWidth / 2) * scale) + ((bass / 255) * (circleMaxLen / 2));
                ctx.beginPath();
                ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                ctx.lineWidth = 5 + (bass / 30);
                ctx.strokeStyle = circleColorInput.value;
                ctx.stroke();
            }
        }
    </script>
</body>
</html>
